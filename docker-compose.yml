---
services:
  wechat-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: wechat-ai:latest
    container_name: wechat-ai
    hostname: wechat-ai
    privileged: true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Asia/Shanghai}
      - LC_ALL=zh_CN.UTF-8
      - TITLE=WeChat-AI
      - CUSTOM_USER=${CUSTOM_USER:-}
      - PASSWORD=${PASSWORD:-}
      - AUTO_START_WECHAT=${AUTO_START_WECHAT:-true}
      - BOT_ENABLED=${BOT_ENABLED:-true}
      - BOT_CONFIG_PATH=/config/config.yaml
      - MCP_PORT=8000
      - QT_AUTO_SCREEN_SCALE_FACTOR=0
      - QT_SCALE_FACTOR=1
      - QT_FONT_DPI=96
    volumes:
      - ./config:/config
      - ./plugins:/plugins:ro
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "${HTTP_PORT:-3100}:3000"
      - "${HTTPS_PORT:-3101}:3001"
      - "${MCP_PORT:-8100}:8000"
    restart: unless-stopped
    shm_size: "${SHM_SIZE:-2gb}"
